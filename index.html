<!DOCTYPE html>
<html>
<head>
    <title>Color Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans p-4 md:p-10">
    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div>
                <h1 class="text-4xl font-black text-cyan-400 tracking-tighter">Color Detector</h1>
                <p class="text-slate-400">Upload an image to detect colors</p>
            </div>
            <div class="flex items-center gap-4">
                <input type="file" id="fileInp" accept="image/*" class="bg-slate-800 border border-slate-700 p-2 rounded-lg text-sm">
                <button id="processBtn" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold px-6 py-2 rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed" disabled>Detect Colors</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 h-fit">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xs uppercase font-bold text-slate-500 tracking-widest">Detected Colors</h2>
                    <span id="colorCount" class="hidden text-xs bg-cyan-500 text-black font-bold px-2 py-1 rounded-full"></span>
                </div>
                <div id="palette" class="space-y-4"></div>
                <div id="errorMsg" class="hidden mt-4 p-3 bg-red-900/30 border border-red-700 rounded-lg text-sm text-red-300"></div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="bg-black rounded-3xl border-8 border-slate-800 aspect-square flex items-center justify-center overflow-hidden shadow-2xl">
                    <img id="view" class="max-w-full max-h-full hidden">
                    <div id="msg" class="text-slate-600 font-medium">Upload an image to detect colors</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inp = document.getElementById('fileInp');
        const processBtn = document.getElementById('processBtn');
        let selectedFile = null;
        let imagePreviewUrl = null;
        
        inp.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            selectedFile = file;
            processBtn.disabled = !selectedFile;
            
            // Show preview
            if (imagePreviewUrl) {
                URL.revokeObjectURL(imagePreviewUrl);
            }
            imagePreviewUrl = URL.createObjectURL(file);
            document.getElementById('view').src = imagePreviewUrl;
            document.getElementById('view').classList.remove('hidden');
            document.getElementById('msg').classList.add('hidden');
        };
        
        processBtn.onclick = async () => {
            if (!selectedFile) return;
            
            const fd = new FormData();
            fd.append('file', selectedFile);
            
            processBtn.disabled = true;
            processBtn.innerText = "Processing...";
            document.getElementById('msg').innerText = "Analyzing colors...";
            document.getElementById('msg').classList.remove('hidden');
            document.getElementById('errorMsg').classList.add('hidden');
            
            try {
                const res = await fetch('/upload', { method: 'POST', body: fd });
                const data = await res.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Failed to process image');
                }
                
                const pal = document.getElementById('palette');
                pal.innerHTML = '';
                
                if (data.colors && data.colors.length > 0) {
                    data.colors.forEach((hexColor, index) => {
                        // Convert hex to RGB
                        const r = parseInt(hexColor.slice(1, 3), 16);
                        const g = parseInt(hexColor.slice(3, 5), 16);
                        const b = parseInt(hexColor.slice(5, 7), 16);
                        
                        const item = document.createElement('div');
                        item.className = "flex items-center gap-4 bg-slate-900 p-3 rounded-xl border border-slate-700";
                        item.innerHTML = `<div class="w-12 h-12 rounded-lg border border-slate-700" style="background-color:${hexColor}"></div>
                                          <div>
                                            <div class="text-sm font-bold">${hexColor}</div>
                                            <div class="text-[10px] text-slate-500 font-mono">RGB ${r},${g},${b}</div>
                                          </div>`;
                        pal.appendChild(item);
                    });
                } else {
                    pal.innerHTML = '<div class="text-slate-500 text-sm">No colors detected</div>';
                }

                const colorCount = document.getElementById('colorCount');
                colorCount.innerText = `${data.colorsCount || 0} colors`;
                colorCount.classList.remove('hidden');

                document.getElementById('msg').classList.add('hidden');
            } catch (err) {
                const errorMsg = document.getElementById('errorMsg');
                errorMsg.innerText = err.message || "Error processing image. Please try again.";
                errorMsg.classList.remove('hidden');
                document.getElementById('msg').innerText = "Error processing image";
            }
            
            processBtn.disabled = false;
            processBtn.innerText = "Detect Colors";
        };
    </script>
</body>
</html>
